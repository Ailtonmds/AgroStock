<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Usuário | AgroStock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <main class="login-container d-flex align-items-center justify-content-center">
        <section class="login-card" aria-labelledby="tituloCriar">
            <div class="text-center mb-4">
                <img class="logo" src="../assets/img/agrostock-mark.svg" alt="Logo AgroStock">
                <h1 class="brand">AgroStock</h1>
                <p class="subtitle">Sistema de Controle de Estoque</p>
            </div>
            <div class="mb-4">
                <h2 id="tituloCriar" class="h4 mb-1">Criar usuário</h2>
                <p class="text-secondary small mb-0">Cadastre a única conta que terá acesso ao AgroStock.</p>
            </div>
            <form id="criarUsuarioForm">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome completo</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="nome" name="nome" minlength="3" maxlength="150" required autocomplete="name">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="usuario" class="form-label">Usuário</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                        <input type="text" class="form-control" id="usuario" name="usuario" minlength="3" maxlength="100" required autocomplete="username">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="senha" name="senha" minlength="6" required autocomplete="new-password">
                    </div>
                    <div class="form-text">Mínimo 6 caracteres</div>
                </div>
            <div id="mensagemErro" class="alert alert-danger d-none small"></div>
                <div id="mensagemSucesso" class="alert alert-success d-none small"></div>
                <button type="submit" class="btn btn-success w-100 mt-3" id="btnCriar">
                    <span id="textoBotao">Criar conta</span>
                    <span id="loading" class="spinner-border spinner-border-sm d-none"></span>
                </button>
                <div class="text-center mt-3"><a class="auth-link" href="index.html">Voltar ao login</a></div>
            </form>
            <div class="text-center mt-4"><small class="text-secondary">Sistema interno • AgroStock</small></div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/criar_usuario.js"></script>
</body>
</html>
