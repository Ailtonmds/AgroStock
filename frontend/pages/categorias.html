<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias | AgroStock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-fundo">

    <!-- Sidebar (estilo Tabler) -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <img src="../assets/img/logo_branca.png" alt="Logo AgroStock">
            <span>AgroStock</span>
        </div>

        <div class="sidebar-nav">
            <div class="sidebar-section">
                <div class="sidebar-section-title">Navegação</div>
                <a class="sidebar-item" href="dashboard.html">
                    <i class="bi bi-grid"></i>
                    <span class="sidebar-label">Dashboard</span>
                </a>
                <a class="sidebar-item" href="produtos.html">
                    <i class="bi bi-box-seam"></i>
                    <span class="sidebar-label">Produtos</span>
                </a>
                <a class="sidebar-item active" href="categorias.html">
                    <i class="bi bi-tags"></i>
                    <span class="sidebar-label">Categorias</span>
                </a>
                <a class="sidebar-item" href="lotes.html">
                    <i class="bi bi-upc-scan"></i>
                    <span class="sidebar-label">Lotes</span>
                </a>
                <a class="sidebar-item" href="etiquetas.html">
                    <i class="bi bi-barcode"></i>
                    <span class="sidebar-label">Etiquetas</span>
                </a>
                <a class="sidebar-item" href="estoque.html">
                    <i class="bi bi-arrow-left-right"></i>
                    <span class="sidebar-label">Estoque</span>
                </a>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">Relatórios</div>
                <a class="sidebar-item" href="alertas.html">
                    <i class="bi bi-bell"></i>
                    <span class="sidebar-label">Alertas</span>
                </a>
                <a class="sidebar-item" href="relatorios.html">
                    <i class="bi bi-file-earmark-bar-graph"></i>
                    <span class="sidebar-label">Relatórios</span>
                </a>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">Sistema</div>
                <a class="sidebar-item" href="usuarios.html">
                    <i class="bi bi-people"></i>
                    <span class="sidebar-label">Usuários</span>
                </a>
            </div>
        </div>

        <div class="sidebar-footer">
            <a class="sidebar-footer-item" id="btnLogoutSidebar" href="#">
                <i class="bi bi-box-arrow-right"></i>
                <span class="sidebar-label">Sair</span>
            </a>
        </div>
    </nav>

    <!-- Overlay mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Topbar -->
    <header class="topbar" id="topbar">
        <div class="topbar-left">
            <button class="btn-sidebar-toggle" id="btnSidebarToggle" aria-label="Abrir menu">
                <i class="bi bi-list"></i>
            </button>
            <div class="page-header-info">
                <div class="page-title" id="pageTitle">Categorias</div>
                <div class="page-subtitle">Gerencie as categorias de produtos</div>
            </div>
        </div>

        <div class="topbar-right">
            <div class="user-badge" id="userBadge">
                <i class="bi bi-person-circle"></i>
                <span id="usuarioNomeTopbar">Usuário</span>
            </div>
            <button class="btn btn-outline-danger btn-sm" id="btnLogout" title="Sair">
                <i class="bi bi-box-arrow-right"></i>
            </button>
        </div>
    </header>

    <!-- Conteúdo principal -->
    <div class="main-content">
        <main class="container">
            <section class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
                <div class="page-header">
                    <span class="badge-pagina">Estoque</span>
                    <h1 class="h3 fw-bold mb-1">Categorias</h1>
                    <p class="text-secondary mb-0">Gerencie as categorias de produtos</p>
                </div>
                <button class="btn btn-success px-4" data-bs-toggle="modal" data-bs-target="#modalCategoria">
                    <i class="bi bi-plus-lg me-1"></i>Nova categoria
                </button>
            </section>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0" id="tabelaCategorias">
                            <thead class="table-light">
                                <tr>
                                    <th style="width: 30%;">Nome</th>
                                    <th style="width: 40%;">Descrição</th>
                                    <th style="width: 15%;">Status</th>
                                    <th class="text-end" style="width: 15%;">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tbodyCategorias">
                                <tr>
                                    <td colspan="4" class="text-center text-secondary py-4">
                                        <span class="spinner-border spinner-border-sm me-1"></span> Carregando...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Categoria -->
    <div class="modal fade" id="modalCategoria" tabindex="-1" aria-labelledby="modalCategoriaLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalCategoriaLabel">Nova Categoria</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <form id="formCategoria">
                    <div class="modal-body">
                        <input type="hidden" name="id" id="categoriaId">

                        <div class="mb-3">
                            <label for="nome" class="form-label fw-semibold">Nome <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="nome" name="nome" required maxlength="100">
                        </div>

                        <div class="mb-3">
                            <label for="descricao" class="form-label fw-semibold">Descrição</label>
                            <textarea class="form-control" id="descricao" name="descricao" rows="3"></textarea>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="ativo" name="ativo" checked>
                            <label class="form-check-label" for="ativo">Ativa</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success" id="btnSalvarCategoria">
                            <i class="bi bi-check-lg me-1"></i>Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/categorias.js"></script>
    <script>
        // Inicialização da sidebar (menu mobile)
        const sidebar = document.getElementById('sidebar');
        const btnSidebarToggle = document.getElementById('btnSidebarToggle');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const btnLogoutSidebar = document.getElementById('btnLogoutSidebar');

        function toggleSidebar() {
            sidebar.classList.toggle('show');
            sidebarOverlay.classList.toggle('show');
        }

        btnSidebarToggle.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', toggleSidebar);

        document.querySelectorAll('.sidebar-item').forEach(item => {
            item.addEventListener('click', () => {
                if (window.innerWidth <= 991) {
                    sidebar.classList.remove('show');
                    sidebarOverlay.classList.remove('show');
                }
            });
        });

        btnLogoutSidebar.addEventListener('click', (e) => {
            e.preventDefault();
            logout();
        });

        const nome = sessionStorage.getItem('usuario_nome') || 'Usuário';
        document.getElementById('usuarioNomeTopbar').textContent = nome;
    </script>
</body>
</html>
