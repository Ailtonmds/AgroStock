<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16x16.png">
    <link rel="shortcut icon" href="../assets/img/favicon.svg">
    <title>Usuários | AgroStock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-fundo">

    <!-- Sidebar (nav compartilhada) -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <div class="sidebar-brand">
                <img src="../assets/img/logo.png" alt="Logo AgroStock">
                <span>AgroStock</span>
            </div>

            <div class="sidebar-user" id="sidebarUser" title="Usuário logado">
                <div class="sidebar-user-avatar" id="sidebarUserAvatar">U</div>
                <div>
                    <div class="sidebar-user-name" id="sidebarUserNome">Usuário</div>
                    <div class="sidebar-user-role" id="sidebarUserRole">Almoxarife</div>
                </div>
                <i class="bi bi-chevron-down"></i>
            </div>

            <button class="btn-sidebar-toggle" aria-label="Abrir menu">
                <i class="bi bi-list"></i>
            </button>
        </div>

        <div class="sidebar-nav">
            <div class="sidebar-section">
                <div class="sidebar-section-title">Navegação</div>
                <a class="sidebar-item" href="dashboard.html">
                    <i class="bi bi-grid"></i>
                    <span class="sidebar-label">Dashboard</span>
                </a>
                <a class="sidebar-item" href="produtos.html">
                    <i class="bi bi-box-seam"></i>
                    <span class="sidebar-label">Produtos</span>
                </a>
                <a class="sidebar-item" href="categorias.html">
                    <i class="bi bi-tags"></i>
                    <span class="sidebar-label">Categorias</span>
                </a>
                <a class="sidebar-item" href="lotes.html">
                    <i class="bi bi-upc-scan"></i>
                    <span class="sidebar-label">Lotes</span>
                </a>
                <a class="sidebar-item" href="etiquetas.html">
                    <i class="bi bi-barcode"></i>
                    <span class="sidebar-label">Etiquetas</span>
                </a>
                <a class="sidebar-item" href="estoque.html">
                    <i class="bi bi-arrow-left-right"></i>
                    <span class="sidebar-label">Estoque</span>
                </a>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">Relatórios</div>
                <a class="sidebar-item" href="alertas.html">
                    <i class="bi bi-bell"></i>
                    <span class="sidebar-label">Alertas</span>
                    <span class="nav-badge" id="badgeAlertas">0</span>
                </a>
                <a class="sidebar-item" href="relatorios.html">
                    <i class="bi bi-file-earmark-bar-graph"></i>
                    <span class="sidebar-label">Relatórios</span>
                </a>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">Sistema</div>
                <a class="sidebar-item active" href="usuarios.html">
                    <i class="bi bi-people"></i>
                    <span class="sidebar-label">Usuários</span>
                </a>
            </div>
        </div>

        <div class="sidebar-footer">
            <a class="sidebar-footer-item" id="btnLogoutSidebar" href="#">
                <i class="bi bi-box-arrow-right"></i>
                <span class="sidebar-label">Sair</span>
            </a>
        </div>
    </nav>

    <!-- Overlay mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Conteúdo principal -->
    <div class="main-content">
        <main class="container">
            <section class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
                <div class="page-header">
                    <span class="badge-pagina">Sistema</span>
                    <h1 class="h3 fw-bold mb-1">Usuários</h1>
                    <p class="text-secondary mb-0">Gerencie os usuários do sistema</p>
                </div>
                <button class="btn btn-success px-4" data-bs-toggle="modal" data-bs-target="#modalUsuario">
                    <i class="bi bi-plus-lg me-1"></i>Novo usuário
                </button>
            </section>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0" id="tabelaUsuarios">
                            <thead class="table-light">
                                <tr>
                                    <th style="width: 26%;">Nome</th>
                                    <th style="width: 18%;">Usuário</th>
                                    <th style="width: 14%;">Status</th>
                                    <th style="width: 20%;">Criado em</th>
                                    <th class="text-end" style="width: 22%;">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tbodyUsuarios">
                                <tr>
                                    <td colspan="5" class="text-center text-secondary py-4">
                                        <span class="spinner-border spinner-border-sm me-1"></span> Carregando...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Usuário -->
    <div class="modal fade" id="modalUsuario" tabindex="-1" aria-labelledby="modalUsuarioLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalUsuarioLabel">Novo Usuário</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <form id="formUsuario">
                    <div class="modal-body">
                        <input type="hidden" name="id" id="usuarioId">

                        <div class="mb-3">
                            <label for="nome" class="form-label fw-semibold">Nome completo <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="nome" name="nome" required maxlength="150">
                        </div>

                        <div class="mb-3">
                            <label for="usuario" class="form-label fw-semibold">Nome de usuário <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="usuario" name="usuario" required maxlength="100">
                        </div>

                        <div class="mb-3">
                            <label for="senha" class="form-label fw-semibold">Senha <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="senha" name="senha" required minlength="6" autocomplete="new-password">
                            <div class="form-text" id="senhaHelp">Mínimo 6 caracteres</div>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="ativo" name="ativo" checked>
                            <label class="form-check-label" for="ativo">Usuário ativo</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success" id="btnSalvarUsuario">
                            <i class="bi bi-check-lg me-1"></i>Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/sidebar.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/usuarios.js"></script>
</body>
</html>
